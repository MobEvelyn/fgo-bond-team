<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FGO 羁绊配队</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/bond.css"></head><body>
<header><div class="brand">FGO CN · 国服</div><h1>羁绊配队</h1><p>先筛选从者，再找出能覆盖最多人的特攻羁绊礼装。</p></header><main><div id="notice" class="notice hidden"></div>
<section class="panel setup"><div><b>①</b><strong>同步国服资料</strong><button id="syncBtn" class="primary">开始同步</button><span id="syncState" class="muted">首次使用需同步</span></div><div><b>②</b><strong>导入玩家数据</strong><textarea id="captureText" placeholder="方式一：粘贴 eyJ... 开头的完整 toplogin 字符串"></textarea><button id="importBtn" class="primary">识别粘贴内容</button><span class="or">或者</span><input id="jsonFile" type="file" accept=".json,application/json"><select id="jsonProfile" class="hidden" aria-label="选择国服账号"></select><button id="jsonImportBtn" class="primary">上传 Chaldea JSON</button><span id="accountState" class="muted">尚未识别</span><small class="local-note">文件只在这台电脑的本地程序中处理</small></div></section>
<section class="panel"><div class="panel-title"><b>3</b><div><h2>筛选候选从者</h2><p>例如选择“骑阶”；特性可继续选“秩序”“善”，多个特性同时满足</p></div></div><div class="filters"><label>职阶<select id="classFilter"><option value="">全部职阶</option></select></label><label>特性一<select id="traitA"><option value="">不限</option></select></label><label>特性二<select id="traitB"><option value="">不限</option></select></label><label>搜索名字<input id="search" placeholder="输入从者名字"></label></div><div class="candidate-head"><strong id="candidateCount">请先识别账号</strong><button id="analyzeBtn" class="recommend" disabled>分析哪些羁绊礼装覆盖人数最多</button></div><div id="servantList" class="servant-list"><div class="empty">识别账号后显示从者头像</div></div></section>
<section id="analysis" class="results hidden"><div class="result-heading"><div><span>BOND CE COVERAGE</span><h2>羁绊礼装覆盖结果</h2></div></div><p class="muted">优先显示能让候选从者中最多人获得加成的礼装。点击“只看这些从者”可继续缩小队伍。</p><div id="ceList"></div></section>
<section class="panel"><div class="panel-title"><b>4</b><div><h2>选择最终队伍</h2><p>在上方点击头像选择，最多 6 名</p></div></div><div id="pickedList" class="picked-list"><div class="empty">尚未选择</div></div><strong id="selectedCount">已选择 0 / 6</strong></section>
</main><footer>非官方玩家工具 · 数据来自 Atlas Academy</footer><script src="/static/app.js"></script></body></html>
